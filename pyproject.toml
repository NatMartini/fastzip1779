[project]
name = "fastzip"
version = "0.1.0"
description = "Private, asynchronous image and video compression"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.38,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3", "argon2-cffi>=23.1,<26", "python-multipart>=0.0.20,<1",
  "pillow>=11.1,<13", "boto3>=1.36,<2", "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "moto[s3]>=5,<6", "pyyaml>=6,<7"]

[project.scripts]
fastzip = "fastzip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/fastzip"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL", "video: requires ffmpeg and ffprobe"]
