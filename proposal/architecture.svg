<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5361"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .s  { font-size: 12px; fill: #4a5361; }
      .lbl{ font-size: 12px; fill: #4a5361; font-style: italic; }
      .grp{ font-size: 14px; font-weight: 700; fill: #33415c; }
      .grps{ font-size: 12px; fill: #5b6578; }
      .e  { stroke: #4a5361; stroke-width: 1.6; fill: none; }
      .ed { stroke: #4a5361; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
      .svc{ fill: #eef4ff; stroke: #3b6fd8; stroke-width: 1.5; }
      .dat{ fill: #fff4e5; stroke: #d9822b; stroke-width: 1.5; }
      .ops{ fill: #eaf7ef; stroke: #2e9e5b; stroke-width: 1.5; }
      .cli{ fill: #f3f0ff; stroke: #7357d9; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1440" height="830" fill="#ffffff"/>

  <g transform="translate(40,0)">
  <!-- ===== Group frames ===== -->
  <rect x="250" y="40" width="1130" height="770" rx="14" fill="#f7f9fc" stroke="#8a94a6" stroke-width="1.5"/>
  <text x="266" y="64" class="grp">DigitalOcean (single region)</text>

  <rect x="270" y="80" width="740" height="580" rx="12" fill="#ffffff" stroke="#5b6578" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="284" y="100" class="grp">Docker Swarm · overlay network</text>

  <rect x="290" y="110" width="400" height="530" rx="10" fill="#fafafa" stroke="#9aa3b2" stroke-width="1.3"/>
  <text x="302" y="130" class="grp">Droplet A · Swarm manager</text>
  <text x="302" y="145" class="grps">node label db=true · 2 vCPU / 4 GB</text>

  <rect x="720" y="110" width="270" height="530" rx="10" fill="#fafafa" stroke="#9aa3b2" stroke-width="1.3"/>
  <text x="732" y="130" class="grp">Droplet B · Swarm worker</text>
  <text x="732" y="145" class="grps">2 vCPU / 4 GB</text>

  <!-- ===== Droplet A services ===== -->
  <rect x="310" y="155" width="360" height="50" rx="8" class="svc"/>
  <text x="490" y="176" text-anchor="middle" class="t">Caddy</text>
  <text x="490" y="194" text-anchor="middle" class="s">HTTPS (Let's Encrypt) · serves React frontend</text>

  <rect x="310" y="250" width="360" height="55" rx="8" class="svc"/>
  <text x="490" y="273" text-anchor="middle" class="t">FastAPI · replica 1</text>
  <text x="490" y="292" text-anchor="middle" class="s">accounts · jobs · admin API</text>

  <rect x="310" y="350" width="210" height="65" rx="8" class="dat"/>
  <text x="415" y="376" text-anchor="middle" class="t">PostgreSQL</text>
  <text x="415" y="396" text-anchor="middle" class="s">1 replica · pinned to A</text>

  <!-- Volume as cylinder -->
  <path d="M550,360 a60,9 0 0,0 120,0 v46 a60,9 0 0,1 -120,0 z" class="dat"/>
  <ellipse cx="610" cy="360" rx="60" ry="9" class="dat"/>
  <text x="610" y="388" text-anchor="middle" class="t">DO Volume</text>
  <text x="610" y="405" text-anchor="middle" class="s">10 GB · PG data</text>

  <rect x="310" y="460" width="360" height="55" rx="8" class="svc"/>
  <text x="490" y="483" text-anchor="middle" class="t">Compression worker</text>
  <text x="490" y="502" text-anchor="middle" class="s">Pillow · FFmpeg · CPU/memory limits</text>

  <rect x="310" y="560" width="170" height="55" rx="8" class="svc"/>
  <text x="395" y="583" text-anchor="middle" class="t">Backup</text>
  <text x="395" y="602" text-anchor="middle" class="s">hourly pg_dump → age</text>

  <rect x="500" y="560" width="170" height="55" rx="8" class="svc"/>
  <text x="585" y="583" text-anchor="middle" class="t">Cleanup</text>
  <text x="585" y="602" text-anchor="middle" class="s">expire jobs · delete media</text>

  <!-- ===== Droplet B services ===== -->
  <rect x="740" y="250" width="230" height="55" rx="8" class="svc"/>
  <text x="855" y="273" text-anchor="middle" class="t">FastAPI · replica 2</text>
  <text x="855" y="292" text-anchor="middle" class="s">accounts · jobs · admin API</text>

  <rect x="740" y="460" width="230" height="55" rx="8" class="svc"/>
  <text x="855" y="483" text-anchor="middle" class="t">Compression workers</text>
  <text x="855" y="502" text-anchor="middle" class="s">replicated · CPU/memory limits</text>

  <!-- ===== External DO services ===== -->
  <rect x="1040" y="110" width="250" height="90" rx="8" class="ops"/>
  <text x="1165" y="137" text-anchor="middle" class="t">DO Monitoring</text>
  <text x="1165" y="157" text-anchor="middle" class="s">metrics agent on both droplets</text>
  <text x="1165" y="175" text-anchor="middle" class="s">alerts: CPU · memory · disk → email</text>
  <text x="1165" y="192" text-anchor="middle" class="s">API → admin dashboard</text>

  <rect x="1040" y="250" width="250" height="80" rx="8" class="dat"/>
  <text x="1165" y="281" text-anchor="middle" class="t">Spaces · media bucket</text>
  <text x="1165" y="301" text-anchor="middle" class="s">private · originals + outputs</text>
  <text x="1165" y="318" text-anchor="middle" class="s">media deleted after 24 h</text>

  <rect x="1040" y="560" width="250" height="80" rx="8" class="dat"/>
  <text x="1165" y="591" text-anchor="middle" class="t">Spaces · backup bucket</text>
  <text x="1165" y="611" text-anchor="middle" class="s">encrypted dumps · own scoped key</text>
  <text x="1165" y="628" text-anchor="middle" class="s">24 hourly + 7 daily</text>

  <!-- ===== Edges ===== -->

  <!-- Caddy -> API replicas -->
  <path class="e" d="M430,205 V250" marker-end="url(#arr)"/>
  <path class="e" d="M670,180 H855 V250" marker-end="url(#arr)"/>
  <text x="700" y="172" class="lbl">/api/* · Swarm VIP load balancing</text>

  <!-- API -> PostgreSQL -->
  <path class="e" d="M430,305 V350" marker-end="url(#arr)"/>
  <path class="e" d="M855,305 V328 H480 V350" marker-end="url(#arr)"/>
  <text x="700" y="322" class="lbl">sessions · jobs · errors</text>

  <!-- Workers -> PostgreSQL -->
  <path class="e" d="M430,460 V415" marker-end="url(#arr)"/>
  <path class="e" d="M855,460 V438 H480 V415" marker-end="url(#arr)"/>
  <text x="700" y="432" class="lbl">claim · lease · status</text>

  <!-- PostgreSQL <-> Volume -->
  <path class="e" d="M520,383 H550" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- API / workers <-> Spaces media -->
  <path class="e" d="M970,277 H1040" marker-end="url(#arr)"/>
  <path class="e" d="M970,488 H1165 V330" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="1016" y="481" class="lbl">inputs · outputs</text>


  <!-- Metrics -->
  <path class="ed" d="M1010,155 H1040" marker-end="url(#arr)"/>

  <!-- Backup -> backup bucket -->
  <path class="e" d="M395,615 V690 H1165 V640" marker-end="url(#arr)"/>
  <text x="560" y="684" class="lbl">encrypted pg_dump (hourly)</text>


  <!-- ===== Legend ===== -->
  <rect x="700" y="765" width="16" height="12" rx="2" class="svc"/>
  <text x="722" y="776" class="s">container service</text>
  <rect x="850" y="765" width="16" height="12" rx="2" class="dat"/>
  <text x="872" y="776" class="s">state / storage</text>
  <rect x="990" y="765" width="16" height="12" rx="2" class="ops"/>
  <text x="1012" y="776" class="s">CI/CD &amp; monitoring</text>
  <line x1="1150" y1="771" x2="1180" y2="771" class="ed"/>
  <text x="1186" y="776" class="s">indirect / async</text>
  </g>
  <!-- ===== Clients ===== -->
  <rect x="20" y="110" width="180" height="70" rx="8" class="cli"/>
  <text x="110" y="140" text-anchor="middle" class="t">User browser</text>
  <text x="110" y="160" text-anchor="middle" class="s">sign up · upload · history</text>

  <rect x="20" y="210" width="180" height="70" rx="8" class="cli"/>
  <text x="110" y="240" text-anchor="middle" class="t">Admin browser</text>
  <text x="110" y="260" text-anchor="middle" class="s">dashboard · error log</text>

  <!-- ===== GitHub ===== -->
  <rect x="20" y="560" width="180" height="80" rx="8" class="ops"/>
  <text x="110" y="592" text-anchor="middle" class="t">GitHub Actions</text>
  <text x="110" y="612" text-anchor="middle" class="s">test → build → SSH deploy</text>

  <rect x="20" y="690" width="180" height="60" rx="8" class="ops"/>
  <text x="110" y="716" text-anchor="middle" class="t">GHCR</text>
  <text x="110" y="735" text-anchor="middle" class="s">images tagged by SHA</text>

  <!-- ===== Edges outside the DigitalOcean frame ===== -->
  <path class="e" d="M200,165 H350" marker-end="url(#arr)"/>
  <text x="208" y="158" class="lbl">HTTPS</text>
  <path class="e" d="M200,245 H262 V192 H350" marker-end="url(#arr)"/>
  <path class="ed" d="M1330,290 H1398 V20 H110 V110" marker-end="url(#arr)"/>
  <text x="118" y="62" class="lbl">presigned download</text>
  <text x="118" y="77" class="lbl">URL (5 min)</text>
  <path class="e" d="M200,600 H330" marker-end="url(#arr)"/>
  <path class="e" d="M110,640 V690" marker-end="url(#arr)"/>
  <text x="118" y="670" class="lbl">push</text>
  <path class="ed" d="M200,720 H370 V660" marker-end="url(#arr)"/>
  <text x="208" y="712" class="lbl">pull images</text>
</svg>
