name: Checks
on:
  workflow_call:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env: {POSTGRES_USER: fastzip, POSTGRES_PASSWORD: test-only, POSTGRES_DB: fastzip_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fastzip -d fastzip_test" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fastzip:test-only@localhost:5432/fastzip_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.13.8", enable-cache: true}
      - run: uv sync --frozen --extra dev
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run ruff check backend tests migrations scripts
      - run: uv run ruff format --check backend tests migrations scripts
      - run: uv run pytest -q
      - name: Verify exported container dependencies
        run: uv export --frozen --no-dev --no-emit-project --no-hashes --no-header --output-file /tmp/requirements.lock && diff -u requirements.lock /tmp/requirements.lock
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
  compose-smoke:
    runs-on: ubuntu-24.04
    needs: [tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.13.8"}
      - run: uv sync --frozen
      - run: docker compose config --quiet
      - run: docker compose --profile backup build backup
      - run: docker compose up --build -d
      - run: uv run python scripts/smoke.py --timeout 240
      - run: docker compose exec -T api python scripts/check_link_expiry.py
      - run: docker compose run --rm --no-deps backup python scripts/recovery_smoke.py
      - name: Validate production Swarm configuration
        run: |
          set -a
          source deploy/production.env.example
          set +a
          docker stack config -c deploy/stack.yaml >/dev/null
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
